server:
  servlet:
    encoding:
      charset: utf-8
      force: true

  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
      open-in-view: false


springdoc:
   swagger-ui:
     path: /swagger-ui.html


logging:
  level:
    '[com.example.evchargeproject]' : DEBUG
    '[org.hibernate.type]' : TRACE