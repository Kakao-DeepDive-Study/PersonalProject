server:
  servlet:
    encoding:
      charset: utf-8
      force: true

  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console


  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
        default_batch_fetch_size: 100
      open-in-view: false


logging:
  level:
    '[com.example.evchargeproject]' : DEBUG
    '[org.hibernate.type]' : TRACE